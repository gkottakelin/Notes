<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690">
  <defs>
    <style>
      .title{font:700 40px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#292d35}
      .sub{font:600 27px 'Microsoft YaHei','Noto Sans SC',sans-serif}
      .body{font:20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#343a46}
      .small{font:18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#626b79}
      .arrow{stroke:#87909e;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#87909e"/></marker>
  </defs>
  <rect width="1440" height="690" fill="#fff"/>
  <text x="55" y="72" class="title">从逐算子执行到图模式</text>

  <rect x="55" y="120" width="640" height="480" rx="24" fill="#f7f7f7" stroke="#d6d8dc" stroke-width="2"/>
  <text x="375" y="170" text-anchor="middle" class="sub" fill="#555d69">Eager 模式：逐算子下发</text>
  <rect x="100" y="220" width="110" height="60" rx="12" fill="#fff" stroke="#5573c8" stroke-width="2"/><text x="155" y="258" text-anchor="middle" class="body">Python</text>
  <path d="M210 250 H275" class="arrow"/>
  <rect x="285" y="220" width="110" height="60" rx="12" fill="#fff" stroke="#5573c8" stroke-width="2"/><text x="340" y="258" text-anchor="middle" class="body">框架</text>
  <path d="M395 250 H460" class="arrow"/>
  <rect x="470" y="205" width="170" height="90" rx="12" fill="#fff4ef" stroke="#ba2b1e" stroke-width="2"/><text x="555" y="240" text-anchor="middle" class="body">算子 1 下发</text><text x="555" y="270" text-anchor="middle" class="small">NPU 执行</text>
  <path d="M555 295 V345" class="arrow"/>
  <rect x="470" y="355" width="170" height="90" rx="12" fill="#fff4ef" stroke="#ba2b1e" stroke-width="2"/><text x="555" y="390" text-anchor="middle" class="body">算子 2 下发</text><text x="555" y="420" text-anchor="middle" class="small">NPU 执行</text>
  <text x="95" y="355" class="body">每一步重复产生：</text>
  <text x="95" y="392" class="small">• Python / C++ 层切换</text>
  <text x="95" y="428" class="small">• 框架与驱动调度</text>
  <text x="95" y="464" class="small">• 内存分配与同步等待</text>
  <text x="95" y="535" class="sub" fill="#df7c33">灵活，但平均调度开销高</text>

  <rect x="745" y="120" width="640" height="480" rx="24" fill="#f3fff0" stroke="#75aa48" stroke-width="2"/>
  <text x="1065" y="170" text-anchor="middle" class="sub" fill="#75aa48">图模式：编译后统一执行</text>
  <rect x="790" y="220" width="110" height="60" rx="12" fill="#fff" stroke="#5573c8" stroke-width="2"/><text x="845" y="258" text-anchor="middle" class="body">Python</text>
  <path d="M900 250 H965" class="arrow"/>
  <rect x="975" y="205" width="170" height="90" rx="12" fill="#fff" stroke="#75aa48" stroke-width="2"/><text x="1060" y="240" text-anchor="middle" class="body">图捕获 / 编译</text><text x="1060" y="270" text-anchor="middle" class="small">一次完成</text>
  <path d="M1145 250 H1210" class="arrow"/>
  <rect x="1220" y="190" width="120" height="120" rx="12" fill="#fff4ef" stroke="#ba2b1e" stroke-width="2"/><text x="1280" y="230" text-anchor="middle" class="body">统一调度</text><text x="1280" y="265" text-anchor="middle" class="small">NPU 连续</text><text x="1280" y="290" text-anchor="middle" class="small">执行全部算子</text>
  <text x="790" y="365" class="body">收益：</text>
  <text x="790" y="402" class="small">• 一次编译，多次复用</text>
  <text x="790" y="438" class="small">• 减少 Python / 框架调度</text>
  <text x="790" y="474" class="small">• 便于算子融合与内存规划</text>
  <text x="790" y="535" class="sub" fill="#75aa48">不改变数学结果，只改变执行方式</text>
  <line x1="55" y1="635" x2="1385" y2="635" stroke="#ba2b1e" stroke-width="5"/>
  <text x="720" y="672" text-anchor="middle" class="body">核心思想：先编译，后执行</text>
</svg>
